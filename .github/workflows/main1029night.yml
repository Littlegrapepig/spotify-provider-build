      - name: Gradle compile & assemble APK
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/spotifyplus-1.0.6-gradle-build.log"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          ls -lah "$APK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-1.0.6-Cache-Failure-Log

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (fixed retired tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android platform & build tools
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core sorting unit tests
        shell: bash
        run: bash tests/run_sort_test.sh
      - name: Compile and package LSPosed APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Spotify-PlayCount-Native-v0.3.apk
          test -s Spotify-PlayCount-Native-v0.3.apk
          sha256sum Spotify-PlayCount-Native-v0.3.apk
      - name: Attach APK to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-PlayCount-Native-APK
          path: Spotify-PlayCount-Native-v0.3.apk
          if-no-files-found: error
      - name: Publish direct-download APK under fixed release tag
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=playcount-native-test
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Spotify-PlayCount-Native-v0.3.apk --clobber
          else
            gh release create "$TAG" Spotify-PlayCount-Native-v0.3.apk \
              --target "$GITHUB_SHA" \
              --title 'Spotify Native PlayCount - test build' \
              --notes 'LSPosed experimental build for Spotify 9.2.0.2053. Includes original sort-button hook and one-tap diagnostic export. Not yet validated on a physical device.' \
              --prerelease
          fi

name: Build SpotifyPlus MultiSource 1.0.4 Accurate Lyrics APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-spotifyplus-multisource.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -f "$SDK_ROOT/platforms/android-37.0/android.jar" ]; then
            echo 'Installing Android 37.0 platform if available on this runner...'
            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --install 'platforms;android-37.0' || true
            elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' || true
            fi
          fi
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar" || {
            echo '::error::Android 37.0 platform missing after attempted installation'; exit 1;
          }
          java -version

      - name: Clone pinned SpotifyPlus 1.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.0.0 https://github.com/Kifranei/SpotifyPlus.git upstream
          chmod +x upstream/gradlew
          test -f upstream/app/src/main/java/dev/kifranei/spotifyplus/hook/LyricsBridgeHook.kt
          test -f upstream/app/build.gradle.kts


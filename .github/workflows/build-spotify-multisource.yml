          PATCH_BASE64
          tar -tzf /tmp/multi-source-patch.tar.gz
          tar -xzf /tmp/multi-source-patch.tar.gz -C upstream
          python3 - <<'PYTHON'
          from pathlib import Path
          root=Path('upstream')
          p=root/'spotify-music/build.gradle.kts'
          data=p.read_text(encoding='utf-8')
          def replace_once(source,old,new):
              if source.count(old)!=1: raise RuntimeError('Missing or duplicated source pattern: '+old)
              return source.replace(old,new)
          data=replace_once(data,'versionCode = 4','versionCode = 8')
          data=replace_once(data,'versionName = "1.0.1"','versionName = "1.0.4-multisource-b3"')
          data=replace_once(data,'version = release(rootProject.extra.get("compileSdkVersion") as Int)',
            'version = release(rootProject.extra.get("compileSdkVersion") as Int) { minorApiLevel = 0 }')
          data=replace_once(data,'implementation(project(":share:extensions-android"))',
            'implementation(project(":share:extensions-android"))\n    implementation(project(":share:cloudlyric"))\n    implementation(project(":share:lrckit"))')
          p.write_text(data,encoding='utf-8')
          p=root/'share/extensions-android/build.gradle.kts'
          data=p.read_text(encoding='utf-8')
          data=replace_once(data,'version = release(36)','version = release(36) { minorApiLevel = 1 }')
          p.write_text(data,encoding='utf-8')
          p=root/'settings.gradle.kts'
          lines=p.read_text(encoding='utf-8').splitlines(keepends=True)
          required={':spotify-music', ':share:extensions-kt', ':share:extensions-android',
                   ':share:cloudlyric', ':share:lrckit', ':share:qrckit'}
          seen=set()
          output=[]
          for line in lines:
              st=line.strip()
              if st.startswith('include('):
                  matches={name for name in required if ('"'+name+'"') in st}
                  if not matches: continue
                  seen.update(matches)
              output.append(line)
          if seen != required: raise RuntimeError('Missing Gradle modules: '+str(required-seen))
          p.write_text(''.join(output),encoding='utf-8')
          print('MultiSource overlay applied; required modules:',sorted(seen))
          PYTHON
      - name: Prepare isolated signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/spotify-provider-multisource.jks" \
            -alias unofficial -storepass changeit123 -keypass changeit123 \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=Unofficial Spotify Provider MultiSource test build' -noprompt
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/spotify-provider-multisource.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=changeit123" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=unofficial" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=changeit123" >> "$GITHUB_ENV"
      - name: Build signed MultiSource APK
        shell: bash
        working-directory: upstream
        run: |
          set -o pipefail
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.daemon=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.incremental=true
          EOF
          ./gradlew :spotify-music:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/multisource-build.log"
          ls -l spotify-music/build/outputs/apk/release/
      - name: Save diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MultiSource-build-diagnostics
          path: ${{ runner.temp }}/multisource-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload MultiSource APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyProvider-1.0.3-MultiSource-beta2
          path: upstream/spotify-music/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

name: Build Spotify Provider 1.0.4 MultiSource beta3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-spotify-multisource.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK 37.0 and 36.1
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          test -f "$SDK_ROOT/platforms/android-36.1/android.jar"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          echo 'SDK platforms found'
      - name: Clone pinned LyricProvider source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/tomakino/LyricProvider.git upstream
          git -C upstream checkout --detach be4c131f9303966e2bb146c3e7c0665cf69585cb
          chmod +x upstream/gradlew
      - name: Overlay MultiSource provider source and Gradle fixes
        shell: bash

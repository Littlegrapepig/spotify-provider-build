          tar -xzf /tmp/spotify-provider-patch.tgz -C upstream
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('upstream/spotify-music/build.gradle.kts')
          content = p.read_text(encoding='utf-8')
          assert 'versionCode = 4' in content and 'versionName = "1.0.1"' in content, 'Unexpected upstream Spotify version'
          content = content.replace('versionCode = 4', 'versionCode = 5')
          content = content.replace('versionName = "1.0.1"', 'versionName = "1.0.2-unofficial"')
          p.write_text(content, encoding='utf-8')

          # Android 17 uses a minor SDK platform (android-37.0). Plain
          # release(37) refers to an unavailable android-37 directory.
          target = Path('upstream/spotify-music/build.gradle.kts')
          data = target.read_text(encoding='utf-8')
          old = 'version = release(rootProject.extra.get("compileSdkVersion") as Int)'
          assert old in data, 'Spotify Gradle DSL changed; stop rather than silently skip fix'
          data = data.replace(old,
              'version = release(rootProject.extra.get("compileSdkVersion") as Int) { minorApiLevel = 0 }')
          target.write_text(data, encoding='utf-8')

          # AndroidX Core 1.18.0 is compiled with API 36.1. Use the exact
          # minor version for the shared library that depends on it.
          target = Path('upstream/share/extensions-android/build.gradle.kts')
          data = target.read_text(encoding='utf-8')
          assert 'version = release(36)' in data, 'Shared library SDK DSL changed'
          data = data.replace('version = release(36)',
                              'version = release(36) { minorApiLevel = 1 }')
          target.write_text(data, encoding='utf-8')
          print('Applied SDK 37.0 and 36.1 Gradle DSL fixes')
          PYTHON

      - name: Set up signing for local experimental build
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/spotify-provider-test.jks" \
            -alias unofficial -storepass changeit123 -keypass changeit123 \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=Unofficial Spotify Provider test build' -noprompt
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/spotify-provider-test.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=changeit123" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=unofficial" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=changeit123" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        working-directory: upstream
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.daemon=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.incremental=true
          EOF
          ./gradlew :spotify-music:assembleRelease --no-daemon --stacktrace --console=plain
          ls -l spotify-music/build/outputs/apk/release/

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyProvider-1.0.2-UNOFFICIAL-test
          path: upstream/spotify-music/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

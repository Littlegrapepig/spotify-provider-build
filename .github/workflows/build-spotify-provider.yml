name: Build Spotify Provider experimental APK (API 37.0 fix)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-spotify-provider.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu 26.04 ships with Android platform 37.0 and 36.1.
      # Android API 37 has the package name "platforms;android-37.0" (not android-37).
      # Avoid sdkmanager unless a required platform is actually missing.
      - name: Verify preinstalled Android SDK platforms
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          ls -l "$SDK_ROOT/platforms" || true
          ls -l "$SDK_ROOT/build-tools" || true
          if [ ! -f "$SDK_ROOT/platforms/android-37.0/android.jar" ]; then
            echo "::error::Ubuntu image lacks Android SDK 37.0; cannot build this pinned project."
            exit 1
          fi
          if [ ! -f "$SDK_ROOT/platforms/android-36.1/android.jar" ]; then
            echo "::error::Ubuntu image lacks Android SDK 36.1, required by AndroidX Core 1.18.0."
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "::error::Ubuntu image lacks Android build-tools 36.0.0."
            exit 1
          fi
          echo 'Android SDK preflight passed (37.0 / 36.1 / build-tools 36.0.0)'

      - name: Clone pinned upstream source
        shell: bash
        run: |
          git clone https://github.com/tomakino/LyricProvider.git upstream
          git -C upstream checkout --detach be4c131f9303966e2bb146c3e7c0665cf69585cb
          chmod +x upstream/gradlew


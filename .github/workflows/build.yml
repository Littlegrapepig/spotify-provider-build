      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test Last.fm ranking and Compose decoding
        run: bash tests/run_sort_test.sh
      - name: Build Android APK
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-Lastfm-Direct-v081-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view native-sort-v081 >/dev/null 2>&1 && gh release upload native-sort-v081 app/build/outputs/apk/debug/app-debug.apk --clobber || gh release create native-sort-v081 app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title 'Spotify Last.fm Direct v0.8.1' --notes 'Spotify reads Last.fm personal top tracks directly, avoiding Unknown authority. Requires Spotify account settings and device testing.' --prerelease

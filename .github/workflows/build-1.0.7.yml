      - name: Gradle compile & assemble APK
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/spotifyplus-1.0.7-gradle-build.log"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          ls -lah "$APK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-1.0.7-Failure-Log
          path: ${{ runner.temp }}/spotifyplus-1.0.7-gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-MultiSource-1.0.7-Diagnostics-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

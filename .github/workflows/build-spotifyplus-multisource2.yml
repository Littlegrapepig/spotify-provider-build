name: Build SpotifyPlus MultiSource 1.0.3 Quality and Translation APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-spotifyplus-multisource.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 80
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android 37.0 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Android SDK: $SDK_ROOT"
          echo 'Installed Android platforms:'
          ls -la "$SDK_ROOT/platforms" || true
          if [ ! -f "$SDK_ROOT/platforms/android-37.0/android.jar" ]; then
            echo '::error::This runner is missing platforms;android-37.0'
            exit 1
          fi
          java -version

      - name: Clone pinned original SpotifyPlus source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.0.0 https://github.com/Kifranei/SpotifyPlus.git upstream
          chmod +x upstream/gradlew
          test -f upstream/app/src/main/java/dev/kifranei/spotifyplus/hook/LyricsBridgeHook.kt
          test -f upstream/app/build.gradle.kts
          echo 'Original project v1.0.0 cloned successfully.'

      - name: Apply multi-source lyric patch

          0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iAN0iDdX/p/SectLgB4AAA=
          PATCH_BASE64
          tar -tzf "$RUNNER_TEMP/spotifyplus-multisource-overlay.tgz"
          tar -xzf "$RUNNER_TEMP/spotifyplus-multisource-overlay.tgz" -C .
          python3 -m py_compile scripts/apply.py
          python3 scripts/apply.py
          grep -F 'client.fetch(t.title, t.artist, t.durationMs)' upstream/app/src/main/java/dev/kifranei/spotifyplus/hook/LyricsBridgeHook.kt
          grep -F 'versionName = "1.0.2-multisource-beta"' upstream/app/build.gradle.kts
          grep -F 'applicationId = "dev.kifranei.spotifyplus.multisource"' upstream/app/build.gradle.kts
          if grep -Fq 'val lyr = client.fetch(t.id, language(), prefs.lyricsMarket)' upstream/app/src/main/java/dev/kifranei/spotifyplus/hook/LyricsBridgeHook.kt; then
            echo '::error::Old Spotify-only fetching path still active'
            exit 1
          fi
          echo 'MultiSource overlay and configuration checks passed.'

      - name: Build test APK (signed automatically with debug key)
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/spotifyplus-multisource-1.0.2-build.log"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lah "$APK"
          sha256sum "$APK"

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-MultiSource-1.0.2-build-log
          path: ${{ runner.temp }}/spotifyplus-multisource-1.0.2-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlus-MultiSource-1.0.2-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
